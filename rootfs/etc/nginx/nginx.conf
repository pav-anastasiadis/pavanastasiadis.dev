worker_processes  1;
daemon            off;
master_process    off;
user root root;

events {
  worker_connections  64;
}

http {
  include mime.types;
  default_type application/octet-stream;

  open_file_cache           max=10000 inactive=30s;
  open_file_cache_min_uses  2;
  open_file_cache_errors    on;

  error_log stderr error;
  access_log off;

  sendfile              on;
  keepalive_timeout     10s;
  keepalive_requests    10000;
  send_timeout          10s;

  gzip on;
  gzip_types text/html text/css application/javascript application/json application/xml text/plain image/svg+xml;

  server {
    listen              8080;
    server_name         _;

    root                /wwwroot;
    index               index.html;

    # Behind the Unikraft Cloud TLS proxy (443 -> 8080): keep redirects
    # relative so clients never see the internal port.
    absolute_redirect   off;
    port_in_redirect    off;

    add_header X-Frame-Options DENY always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    # Static export emits /blog.html (not /blog/index.html), so canonicalize
    # trailing-slash requests to the extensionless URL.
    rewrite ^/(.+)/$ /$1 permanent;

    location / {
      try_files $uri $uri.html $uri/ =404;
    }

    location = /rss.xml {
      default_type application/xml;
      try_files $uri =404;
    }

    location /_next/static/ {
      expires 1y;
      add_header Cache-Control "public, immutable";
    }

    error_page 404 /404.html;
  }
}
